name: AWFMS CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ── Backend Tests ──────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: awfms_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: awfms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://awfms_test:test_password@localhost:5432/awfms_test
          JWT_SECRET: test-jwt-secret-min-32-characters-long
          REFRESH_TOKEN_SECRET: test-refresh-secret-min-32-characters
          REDIS_URL: redis://localhost:6379
          FRONTEND_URL: http://localhost:5173
        run: npx prisma migrate deploy --schema src/prisma/schema.prisma

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://awfms_test:test_password@localhost:5432/awfms_test
          JWT_SECRET: test-jwt-secret-min-32-characters-long
          REFRESH_TOKEN_SECRET: test-refresh-secret-min-32-characters
          REDIS_URL: redis://localhost:6379
          FRONTEND_URL: http://localhost:5173
          NODE_ENV: test
        run: npm test -- --coverage --reporter=verbose

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./backend/coverage

  # ── Frontend Tests ─────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --coverage

      - name: Build
        env:
          VITE_API_URL: https://api.awfms.example.com
        run: npm run build

  # ── Deploy Backend (main branch only) ─────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Railway
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd backend
          railway up --service awfms-backend --detach

  # ── Deploy Frontend (main branch only) ────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'
